services:
  - type: web
    name: soc-bo-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Origen del frontend en Vercel. Se define en el panel de Render una vez
      # que existe la URL del deploy.
      - key: ALLOWED_ORIGINS
        sync: false
