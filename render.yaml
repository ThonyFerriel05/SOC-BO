services:
  - type: web
    name: soc-bo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Origen del frontend. Dejar vacío o "*" al crear el servicio; después
      # restringir al dominio de Vercel/Render del frontend.
      - key: ALLOWED_ORIGINS
        sync: false
